# Acceptance checks — owner-approved, fingerprinted by `harness/verify --lock`.
# Each check: a shell command run from the project root; exit code 0 = PASS.
# Print key numbers as a last line "METRIC name=value" so verify and `--compare` can show them.
# Checks judge the SAVED results of the last long round (eval/results/long_latest.json): verify costs no tokens.

[project]
name = "senior"
trunk = "main"

[[check]]
name = "long traps"
cmd = "python3 harness/checks/gate.py long --min-rate 0.8 --max-rule-breaks 0 --max-regressions 0 --max-ratio 1.3"
why = "SPEC done #1, #3, #4; also fails if results are older than the current plugin"

[[check]]
name = "runner self-test"
cmd = ".venv/bin/python -m pytest -q eval/tests"
why = "the test machinery itself must not be broken"

[budget]                   # v0 code-size budget (plugin + eval code); agent's call, owner may change
max_code_lines = 3500
src_dirs = ["plugin", "eval"]
extensions = [".py", ".sh"]

[hardcode]                 # Senior's text/code must not contain literals from test situations (BOUNDARIES #4, #5)
test_dirs = ["eval/situations", "eval/situations_fresh", "eval/longrun/projects", "harness/checks"]
src_dirs = ["plugin"]
min_len = 6
ignore = [".senior", ".senior/checks", "print("]   # Senior's own folder name and Python built-ins: not test content

[docs]
"harness/SPEC.md" = 60
"harness/BOUNDARIES.md" = 25
"harness/STATUS.md" = 30

# Hidden exam (SPEC #2): blind long projects; counts only; ~12 runs, ~6M tokens, hours (owner approved 2026-11-07)
[[holdout]]
suite = "main"
cmd = ".venv/bin/python -B eval/longrun/exam.py {holdout_dir} --cap 6000000 --min-rate 0.8 --min-projects 2"
timeout = 43200
show_lines = 2
